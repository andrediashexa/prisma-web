name: prisma-web

services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # Publishes on 0.0.0.0 and [::] — reachable over IPv4 and IPv6.
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      front:
        condition: service_healthy
      back:
        condition: service_healthy
    networks: [edge]

  front:
    build: ./front
    restart: unless-stopped
    depends_on:
      back:
        condition: service_healthy
    networks: [edge]

  back:
    build:
      context: ./back
      args:
        BIN: prisma-web-server
        CACHE_ID: ${COMPOSE_PROJECT_NAME:-prisma-web}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-prisma}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-prisma_web}
      BIND_ADDR: "[::]:8000"
      # Optional: registers this Prisma (gRPC address) on first start. Add the others through the UI.
      PRISMA_API_URL: ${PRISMA_API_URL:-}
      # Plain http:// (gRPC without TLS) is for the simulated Prismas only; a real Prisma speaks mTLS (#35).
      PRISMA_ALLOW_PLAINTEXT: ${PRISMA_ALLOW_PLAINTEXT:-false}
      # TLS profiles (mTLS with the Prismas): each subdirectory holds ca.crt and the client pair.
      PRISMA_TLS_DIR: /run/prisma-tls
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      RUST_LOG: ${RUST_LOG:-info,tower_http=info,sqlx=warn}
    volumes:
      # Certificates of the real Prismas: read-only, never inside the image (issue #4).
      - ${PRISMA_TLS_DIR:-/etc/prisma-web}:/run/prisma-tls/host:ro
      # Development profiles generated by scripts/dev-certs.sh (mock with mTLS).
      - ./dev-certs/profiles:/run/prisma-tls/dev:ro
    # The client key has mode 0640: the process needs the group that owns the files.
    group_add: ["${PRISMA_TLS_GID:-1000}"]
    depends_on:
      db:
        condition: service_healthy
      dev-certs:
        condition: service_completed_successfully
        required: false
    networks: [edge, internal]

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prisma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-prisma_web}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # No published ports: only the back end reaches the database.
    networks: [internal]

  # Simulated Prismas for development, enabled by the "mock" profile (COMPOSE_PROFILES=mock).
  # They implement the Prisma proto (gRPC). prisma-mock: http://prisma-mock:50051 (no TLS);
  # prisma-mock-2: https://prisma-mock-2:50051 with mTLS, like the real Prisma (profile "dev/mock").
  dev-certs:
    profiles: [mock]
    image: alpine:3.20
    working_dir: /w
    volumes:
      - ./:/w
    # First run only: installs openssl, generates the files and hands them to the certificate group.
    command:
      - sh
      - -c
      - >-
        test -d dev-certs/profiles/cgnat && exit 0;
        apk add -q --no-cache openssl && sh scripts/dev-certs.sh &&
        chown -R ${PRISMA_TLS_GID:-1000}:${PRISMA_TLS_GID:-1000} dev-certs

  prisma-mock:
    profiles: [mock]
    build:
      context: ./back
      args:
        BIN: prisma-mock
        CACHE_ID: ${COMPOSE_PROJECT_NAME:-prisma-web}
    image: ${COMPOSE_PROJECT_NAME:-prisma-web}-prisma-mock
    restart: unless-stopped
    environment:
      BIND_ADDR: "[::]:50051"
      MOCK_HOSTNAME: prisma-hq
      # The newest box the mock simulates: what follows the release is offered on it (replace and
      # rename 0.151.13 #74, show log 0.151.14 #75, transceivers 0.151.15 #76, the log's phases 2
      # and 3 0.152.0 #78 and 0.152.2 #79, management in a VRF 0.152.4 #82); prisma-mock-lines stays
      # the older box (0.149.0-mock).
      MOCK_RELEASE: "0.152.4-mock"
    networks: [internal]

  prisma-mock-2:
    profiles: [mock]
    image: ${COMPOSE_PROJECT_NAME:-prisma-web}-prisma-mock
    # Built by the prisma-mock service, never pulled.
    pull_policy: never
    depends_on:
      prisma-mock:
        condition: service_started
      dev-certs:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      BIND_ADDR: "[::]:50051"
      MOCK_HOSTNAME: prisma-branch
      MOCK_TRAFFIC_SCALE: "0.3"
      # Shows the "dataplane restarted by itself" warning (Prisma 0.148.7, #20).
      MOCK_DATAPLANE_RESTARTED: "1"
      # Closes a candidate idle for 15 s instead of the box's 30 min, so e2e sees one expire (#11).
      MOCK_CANDIDATE_IDLE_SECS: "15"
      # All three CGNAT log streams configured (Prisma 0.149.15, #34); prisma-mock has none, like the lab box.
      MOCK_LOG_EXPORT: "1"
      # A 0.149.26 box whose account has no `operator`: SystemService refused, can_operate false (#50, #51).
      MOCK_SYSTEM_DENIED: "1"
      MOCK_RELEASE: "0.149.26-mock"
      MOCK_TLS_DIR: /run/tls
    volumes:
      - ./dev-certs/mock-server:/run/tls:ro
    group_add: ["${PRISMA_TLS_GID:-1000}"]
    networks: [internal]

  # A box before the typed configuration (Prisma 0.149.20): no GetConfig, SetConfig or
  # DeleteConfig, so the forms keep their line implementation (#46). http://prisma-mock-lines:50051.
  prisma-mock-lines:
    profiles: [mock]
    image: ${COMPOSE_PROJECT_NAME:-prisma-web}-prisma-mock
    pull_policy: never
    depends_on:
      prisma-mock:
        condition: service_started
    restart: unless-stopped
    environment:
      BIND_ADDR: "[::]:50051"
      MOCK_HOSTNAME: prisma-lines
      MOCK_NO_TYPED: "1"
    networks: [internal]

networks:
  # Both networks are dual-stack. ULA prefixes (fd00::/8) are only valid inside the host.
  edge:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.30.57.0/24
        - subnet: fd70:5057:1::/64
  internal:
    internal: true
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.30.58.0/24
        - subnet: fd70:5057:2::/64

volumes:
  db-data:
  caddy-data:
