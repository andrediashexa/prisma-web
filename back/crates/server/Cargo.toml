[package]
name = "prisma-web-server"
description = "prisma-web back end: authentication, audit and the bridge to Prisma"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
prisma-proto.workspace = true
anyhow.workspace = true
argon2 = { version = "0.5", features = ["std"] }
axum.workspace = true
axum-extra = { version = "0.10", features = ["cookie"] }
base64 = "0.22"
chrono.workspace = true
prost-types.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "uuid", "chrono", "json"] }
thiserror.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid = { version = "1", features = ["serde", "v4"] }
x509-parser = "0.18"
